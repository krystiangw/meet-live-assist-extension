<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meet Live Assist</title>
  <style>
    :root {
      color-scheme: light dark;
      --say: #1a7f37; --info: #2f6feb; --summary: #b8860b; --explain: #8250df; --risk: #d1242f; --action: #e36209;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px/1.45 system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
      background: Canvas; color: CanvasText;
    }
    header {
      padding: 8px 12px; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    header h1 { font-size: 13px; margin: 0; font-weight: 600; }
    .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .status.ok { background: #1a7f3733; color: #1a7f37; }
    .status.bad { background: #d1242f33; color: #d1242f; }
    .status.idle { background: color-mix(in srgb, CanvasText 12%, transparent); }
    #snapNow {
      font-size: 12px; padding: 2px 7px; border-radius: 10px; cursor: pointer; line-height: 1.3;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit;
    }
    #snapNow:hover { background: color-mix(in srgb, CanvasText 12%, transparent); }
    #session { font-size: 11px; opacity: 0.6; width: 100%; }

    .section-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .5;
      padding: 8px 12px 2px;
    }
    #advice {
      flex: 0 0 auto; max-height: 48vh; overflow-y: auto; padding: 2px 12px 8px;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
    }
    .advice-item {
      display: flex; gap: 8px; padding: 7px 9px; margin: 6px 0; border-radius: 8px;
      border-left: 3px solid var(--info);
      background: color-mix(in srgb, var(--info) 10%, transparent);
    }
    .advice-item .marker { font-size: 11px; font-weight: 700; white-space: nowrap; opacity: .85; }
    .advice-item .body { flex: 1; }
    .speak-btn {
      align-self: flex-start; border: none; background: transparent; cursor: pointer;
      font-size: 14px; padding: 0 2px; opacity: .7; line-height: 1;
    }
    .speak-btn:hover { opacity: 1; }
    .speak-btn:disabled { opacity: .3; cursor: default; }
    .advice-item.SAY { border-left-color: var(--say); background: color-mix(in srgb, var(--say) 12%, transparent); }
    .advice-item.SAY .marker { color: var(--say); }
    .advice-item.INFO { border-left-color: var(--info); background: color-mix(in srgb, var(--info) 10%, transparent); }
    .advice-item.INFO .marker { color: var(--info); }
    .advice-item.SUMMARY { border-left-color: var(--summary); background: color-mix(in srgb, var(--summary) 12%, transparent); }
    .advice-item.SUMMARY .marker { color: var(--summary); }
    .advice-item.EXPLAIN { border-left-color: var(--explain); background: color-mix(in srgb, var(--explain) 12%, transparent); }
    .advice-item.EXPLAIN .marker { color: var(--explain); }
    .advice-item.RISK { border-left-color: var(--risk); background: color-mix(in srgb, var(--risk) 12%, transparent); }
    .advice-item.RISK .marker { color: var(--risk); }
    .advice-item.ACTION { border-left-color: var(--action); background: color-mix(in srgb, var(--action) 12%, transparent); }
    .advice-item.ACTION .marker { color: var(--action); }
    .advice-item.SAY .body { font-weight: 600; }
    .advice-item .body a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .advice-item .body code {
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: color-mix(in srgb, CanvasText 12%, transparent); padding: 1px 4px; border-radius: 4px;
    }
    .rich-img {
      display: block; max-width: 100%; margin-top: 6px; border-radius: 6px;
      border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
    }

    #log { flex: 1; overflow-y: auto; padding: 4px 12px 8px; min-height: 60px; }

    #chat { flex: 0 0 auto; max-height: 26vh; overflow-y: auto; padding: 2px 12px 6px;
      border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    .chat-msg { margin: 6px 0; padding: 6px 9px; border-radius: 8px; max-width: 88%; word-wrap: break-word; }
    .chat-msg.user { margin-left: auto; background: color-mix(in srgb, #2f6feb 20%, transparent); }
    .chat-msg.agent { margin-right: auto; background: color-mix(in srgb, CanvasText 10%, transparent); }
    .chat-msg a { color: inherit; }
    #chatForm { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    #chatInput { flex: 1; padding: 7px 9px; font: inherit; border-radius: 6px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Field; color: FieldText; }
    #chatForm button { padding: 7px 12px; font: inherit; border-radius: 6px; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit; }
    .line { margin: 0 0 6px; opacity: .85; }
    .line .ts { opacity: 0.45; font-variant-numeric: tabular-nums; margin-right: 6px; }
    .line .who { font-weight: 600; }
    .empty { opacity: 0.5; padding: 16px 0; text-align: center; }
    .empty.small { padding: 10px 0; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Meet Live Assist</h1>
    <span id="capStatus" class="status idle">idle</span>
    <span id="srvStatus" class="status idle">server ?</span>
    <button id="snapNow" title="Capture the Meet tab now">📷</button>
    <span id="snapStatus" class="status idle">shots 0</span>
    <span id="shareStatus" class="status bad" hidden>● sharing · 15s</span>
    <label id="ttsCallWrap" title="Route 🔊 into the meeting (BlackHole) instead of your headphones"
           style="font-size:11px;display:flex;align-items:center;gap:3px;cursor:pointer;">
      <input type="checkbox" id="ttsCall" /> 🎙 into call
    </label>
    <span id="speakStatus" class="status idle" hidden></span>
    <span id="session"></span>
  </header>

  <div class="section-label">Advice</div>
  <div id="advice"><div class="empty small">Advice will appear here live…</div></div>

  <div class="section-label">Transcript</div>
  <div id="log"><div class="empty">Waiting for a Google Meet call…</div></div>

  <div class="section-label">Chat</div>
  <div id="chat"></div>
  <form id="chatForm">
    <input id="chatInput" type="text" placeholder="Ask the assistant…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script src="sidepanel.js"></script>
</body>
</html>
